# Meet Agent — produção local (APP_MODE=collab).
#
#   docker compose up -d --build          → mongo, redis, api, worker, streamlit
#   python main.py --bot-worker           → no host: o bot usa o Chromium e o login do Google locais
#
# Portas no host: API 8001, Streamlit 8501, Redis 6380, Mongo 27018
# (fora das portas padrão para não colidir com serviços já instalados na máquina).

x-app: &app
  build: .
  image: meet-agent
  env_file: .env
  environment: &app-env
    APP_MODE: collab
    TZ: America/Sao_Paulo   # mesmo fuso do host: o bot grava started_at fora do container
    API_PORT: "8000"
    MONGO_URI: mongodb://mongo:27017
    REDIS_URL: redis://redis:6379/0
    OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    CAPTURE_ENDPOINT: ""
  volumes:
    - ./data:/app/data
    - model_cache:/root/.cache/huggingface
  depends_on:
    redis:
      condition: service_healthy
    mongo:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *app
    command: python main.py --api
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: python main.py --worker

  streamlit:
    <<: *app
    command: >
      streamlit run presentation/streamlit/app.py
      --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "8501:8501"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  mongo_data:
  model_cache:
