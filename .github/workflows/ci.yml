name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Windows (S10-4): pega caminho com "/" fixo, arquivo aberto sem encoding e fim de linha.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned: v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned: v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned: v4
      - run: docker build -t meet-agent .
